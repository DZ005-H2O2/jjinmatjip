<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b4a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>찐맛집</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="search-bar">
      <form id="search-form" autocomplete="off">
        <input id="search-input" type="search" placeholder="지역 + 키워드 (예: 성수동 파스타)" enterkeyhint="search" />
        <button type="submit" aria-label="검색">🔍</button>
      </form>
      <button id="fav-btn" type="button" aria-label="찜 목록">❤️</button>
    </div>

    <button id="area-search-btn" type="button">🔄 이 지역에서 검색</button>

    <div id="bottom-sheet" class="peek">
      <div id="sheet-handle"><div class="grip"></div></div>
      <div id="sheet-content">
        <div id="analyze-status" hidden></div>
        <div id="sheet-empty">지역과 키워드로 검색해보세요 🍜</div>
        <div id="place-list" hidden></div>
        <div id="place-detail" hidden></div>
        <div id="fav-list" hidden></div>
      </div>
    </div>

    <div id="pw-gate" hidden>
      <div class="pw-card">
        <h2>🔒 우리끼리 암호</h2>
        <p>둘만 아는 비밀번호를 입력해주세요</p>
        <form id="pw-form">
          <input id="pw-input" type="password" placeholder="비밀번호" autocomplete="current-password" />
          <button type="submit">입장</button>
        </form>
        <p id="pw-error" class="error" hidden>비밀번호가 틀렸어요 😢</p>
      </div>
    </div>

    <div id="toast" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
